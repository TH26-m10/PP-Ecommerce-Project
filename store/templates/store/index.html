<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر PP — تجارة إلكترونية</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'store/css/app.css' %}">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo">PP</span>
      <div>
        <h1>محرك التجارة الإلكترونية</h1>
        <p class="subtitle">High-Performance E-Commerce Backend</p>
      </div>
    </div>
    <div id="user-bar" class="user-bar hidden">
      <span id="user-label"></span>
      <span id="balance-label" class="balance"></span>
      <button type="button" class="btn btn-outline" id="btn-logout">خروج</button>
    </div>
  </header>

  <main class="container">
    <div id="toast" class="toast hidden"></div>

    <!-- Auth -->
    <section id="auth-section" class="card auth-card">
      <div class="tabs">
        <button type="button" class="tab active" data-tab="login">تسجيل الدخول</button>
        <button type="button" class="tab" data-tab="register">حساب جديد</button>
      </div>

      <form id="login-form" class="form-panel">
        <label>اسم المستخدم</label>
        <input type="text" id="login-username" placeholder="user0" required>
        <label>كلمة المرور</label>
        <input type="password" id="login-password" placeholder="password123" required>
        <button type="submit" class="btn btn-primary">دخول</button>
        <p class="hint">تجريبي: user0 / password123</p>
      </form>

      <form id="register-form" class="form-panel hidden">
        <label>اسم المستخدم</label>
        <input type="text" id="reg-username" required>
        <label>البريد الإلكتروني</label>
        <input type="email" id="reg-email" required>
        <label>كلمة المرور</label>
        <input type="password" id="reg-password" required>
        <button type="submit" class="btn btn-primary">إنشاء حساب</button>
      </form>
    </section>

    <!-- App -->
    <div id="app-section" class="hidden">
      <nav class="nav-tabs">
        <button type="button" class="nav-tab active" data-page="products">المنتجات</button>
        <button type="button" class="nav-tab" data-page="cart">السلة <span id="cart-badge" class="badge hidden">0</span></button>
        <button type="button" class="nav-tab" data-page="orders">طلباتي</button>
        <button type="button" class="nav-tab" data-page="system">النظام</button>
      </nav>

      <!-- Products -->
      <section id="page-products" class="page">
        <div class="page-header">
          <h2>المنتجات</h2>
          <button type="button" class="btn btn-outline" id="btn-refresh-products">تحديث</button>
        </div>
        <div id="products-grid" class="products-grid"></div>
      </section>

      <!-- Cart -->
      <section id="page-cart" class="page hidden">
        <div class="page-header">
          <h2>سلة التسوق</h2>
          <div class="actions">
            <button type="button" class="btn btn-outline" id="btn-empty-cart">إفراغ السلة</button>
            <button type="button" class="btn btn-primary" id="btn-checkout">إتمام الدفع</button>
          </div>
        </div>
        <div id="cart-content"></div>
        <div id="cart-total" class="cart-total"></div>
      </section>

      <!-- Orders -->
      <section id="page-orders" class="page hidden">
        <div class="page-header">
          <h2>طلباتي</h2>
          <button type="button" class="btn btn-outline" id="btn-refresh-orders">تحديث</button>
        </div>
        <div id="orders-list"></div>
      </section>

      <!-- System -->
      <section id="page-system" class="page hidden">
        <div class="page-header"><h2>معلومات النظام</h2></div>
        <div class="card inner-card">
          <h3>Load Balancer</h3>
          <button type="button" class="btn btn-outline" id="btn-load-balance">اختبار التوزيع</button>
          <pre id="load-balance-result" class="code-block"></pre>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    مشروع البرمجة المتوازية — REST API + Waitress + Celery + Prometheus
  </footer>

  <script src="{% static 'store/js/app.js' %}"></script>
</body>
</html>
